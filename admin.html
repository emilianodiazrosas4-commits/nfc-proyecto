<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Administrativo</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{

    width:400px;

    background:white;

    border-radius:20px;

    padding:40px;

    text-align:center;

    box-shadow:0px 5px 20px rgba(0,0,0,.15);
}

.logo{

    width:140px;

    margin-bottom:20px;
}

h1{

    color:#0b1f3a;

    margin-bottom:10px;
}

.subtitulo{

    color:#666;

    margin-bottom:30px;
}

.btn{

    display:block;

    text-decoration:none;

    color:white;

    padding:15px;

    margin:12px 0;

    border-radius:10px;

    font-weight:bold;

    transition:.3s;
}

.btn:hover{

    transform:scale(1.03);
}

.dashboard{

    background:#0b1f3a;
}

.sheet{

    background:#198754;
}

.excel{

    background:#0d6efd;
}

.footer{

    margin-top:25px;

    color:#777;

    font-size:12px;
}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Panel Administrativo</h1>

<p class="subtitulo">

Sistema de Monitoreo de Interés Académico

</p>

<a
class="btn dashboard"
href="https://emilianodiazrosas4-commits.github.io/nfc-proyecto/dashboard.html">

Ver Dashboard

</a>

<a
class="btn sheet"
href="https://docs.google.com/spreadsheets/d/1eLojKaOf9FPL9eofbL7UaOCCRjAMqh9QzUds1QtLoTw/edit">

Ver Base de Datos

</a>

<a
class="btn excel"
href="https://docs.google.com/spreadsheets/d/1eLojKaOf9FPL9eofbL7UaOCCRjAMqh9QzUds1QtLoTw/export?format=xlsx">

Descargar Excel

</a>

<div class="footer">

Versión 1.0

</div>

</div>

</body>

</html>
