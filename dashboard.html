<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard NFC</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
}

canvas {
  max-width: 90%;
}

h2 {
  margin-top: 20px;
}

#top {
  font-size: 20px;
  margin: 15px;
}
</style>

</head>

<body>

<h2>📊 Interés por Carrera</h2>

<div id="top">Cargando...</div>

<canvas id="grafica"></canvas>

<script>

let chart;

const url = "https://script.google.com/macros/s/AKfycbwOlIdFPBmbbA9fW2uL0rizSokwT_JPEWEQx105jAMGr9Fuvgwb66gDOkMAB56PrTse/exec";

// Obtener datos
async function obtenerDatos() {
  const response = await fetch(url);
  return await response.json();
}

// Crear gráfica
function crearGrafica(datos) {
  const ctx = document.getElementById('grafica').getContext('2d');

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Eléctrica', 'Electrónica', 'Mecatrónica'],
      datasets: [{
        label: 'Visitas',
        data: [
          datos.electrica,
          datos.electronica,
          datos.mecatronica
        ]
      }]
    }
  });
}

// Actualizar gráfica
function actualizarGrafica(datos) {
  chart.data.datasets[0].data = [
    datos.electrica,
    datos.electronica,
    datos.mecatronica
  ];
  chart.update();
}

// Mostrar la carrera más popular
function mostrarTop(datos) {
  let max = Math.max(datos.electrica, datos.electronica, datos.mecatronica);

  let top = "Empate";

  if (max === datos.electrica) top = "⚡ Eléctrica";
  if (max === datos.electronica) top = "🔌 Electrónica";
  if (max === datos.mecatronica) top = "🤖 Mecatrónica";

  document.getElementById("top").innerText = "Carrera más popular: " + top;
}

// 🔄 LOOP AUTOMÁTICO
async function iniciar() {
  const datos = await obtenerDatos();

  crearGrafica(datos);
  mostrarTop(datos);

  // Actualiza cada 5 segundos
  setInterval(async () => {
    const nuevosDatos = await obtenerDatos();
    actualizarGrafica(nuevosDatos);
    mostrarTop(nuevosDatos);
  }, 5000);
}

iniciar();

</script>

</body>
</html>
