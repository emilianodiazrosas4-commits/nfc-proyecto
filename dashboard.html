<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard NFC</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}

.container{
    background:white;
    max-width:700px;
    margin:auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

canvas{
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container">

<h1>📊 Dashboard NFC</h1>

<h2 id="ganador"></h2>

<canvas id="grafica"></canvas>

</div>

<script>

const url =
"https://script.google.com/macros/s/AKfycbxjcwobk-esNaBGn6kz-T4Jd0OFWOsjHntAWqOH2wY_kQSm4tfBYuJnoRbUXJd_IMby/exec";

let chart;

async function cargarDatos(){

    const response = await fetch(url);
    const data = await response.json();

    const valores = [
        data.electrica,
        data.electronica,
        data.mecatronica
    ];

    const carreras = [
        "Eléctrica",
        "Electrónica",
        "Mecatrónica"
    ];

    let max = Math.max(...valores);
    let indice = valores.indexOf(max);

    document.getElementById("ganador").innerHTML =
        "Carrera con mayor interés: " + carreras[indice];

    if(chart){
        chart.destroy();
    }

    const ctx = document
        .getElementById("grafica")
        .getContext("2d");

    chart = new Chart(ctx, {

        type: "bar",

        data: {

            labels: carreras,

            datasets: [{
                label: "Visitas",
                data: valores,
                borderWidth: 1
            }]
        },

        options: {
            responsive:true,
            scales:{
                y:{
                    beginAtZero:true
                }
            }
        }
    });
}

cargarDatos();

setInterval(cargarDatos, 5000);

</script>

</body>
</html>
